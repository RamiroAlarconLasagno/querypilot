# pyproject.toml
[project]
name = "querypilot"
version = "0.1.0"
description = "Convierte preguntas de negocio en analisis verificables sobre una base de datos existente"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "alembic>=1.19",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "typer>=0.15",
    "openpyxl>=3.1",
]

[project.scripts]
querypilot-semantic = "querypilot.business_knowledge.commands:app"
querypilot-eval = "querypilot.interpretation.evaluation_cli:app"
querypilot-seed = "scripts.seed_demo:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "mypy>=1.20",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

# --- Calidad ---------------------------------------------------------------
# ruff 0.16 habilita 413 reglas por defecto. Se parte de ese conjunto y se
# desactiva lo que estorba, en vez de acumular una lista larga de select.
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", "client"]

[tool.ruff.lint]
ignore = [
    "D203", "D213",   # convenciones de docstring mutuamente excluyentes
    "COM812",         # conflictua con el formateador
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]   # assert y numeros magicos son normales en tests

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["migrations/", "client/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requiere PostgreSQL real",
    "evaluation: consume el modelo de lenguaje. NUNCA se ejecuta en CI",
]

[tool.coverage.run]
source = ["src/querypilot"]
omit = ["*/observability/*"]
