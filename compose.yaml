# compose.yaml
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar}
      POSTGRES_DB: querypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base de negocio y el usuario de SOLO LECTURA.
      # Dos usuarios distintos: sin eso, la prueba de solo lectura no prueba nada.
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QP_SYSTEM_DB_URL: postgresql+psycopg://querypilot:${POSTGRES_PASSWORD:-cambiar}@postgres:5432/querypilot
      QP_BUSINESS_DB_URL: postgresql+psycopg://qp_readonly:${READONLY_PASSWORD:-cambiar}@postgres:5432/demo_negocio
      QP_API_KEY: ${QP_API_KEY:-clave-de-desarrollo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/salud').status_code==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
