# semantic/demo/dimensions.yaml

dimensions:
  - id: customer
    business_name: Cliente
    synonyms: [clientes, cuenta, cuentas]
    expected_cardinality: 1240
    physical:
      source: ent_com
      attribute: ent_com.raz_soc
      key: ent_com.ent_id
      relation: cmp_cab.ent_id = ent_com.ent_id
      # ent_com mezcla clientes y proveedores: tp = 1 es cliente
      permanent_filter: ent_com.tp = 1

  - id: region
    business_name: Region
    synonyms: [zona, zonas, regiones]
    expected_cardinality: 6
    hierarchy: [region, province]
    physical:
      source: geo_ref
      attribute: geo_ref.desc_1
      key: geo_ref.geo_id
      relation: ent_com.geo_id = geo_ref.geo_id

  - id: product
    business_name: Producto
    synonyms: [productos, articulo, articulos, sku]
    expected_cardinality: 3800
    physical:
      source: art_mae
      attribute: art_mae.desc_larga
      key: art_mae.art_cod
      relation: cmp_det.art_cod = art_mae.art_cod

  - id: category
    business_name: Categoria
    synonyms: [rubro, familia, categorias]
    expected_cardinality: 24
    hierarchy: [category, product]
    physical:
      source: art_rub
      attribute: art_rub.rub_desc
      key: art_rub.rub_cod
      relation: art_mae.rub_cod = art_rub.rub_cod

  - id: salesperson
    business_name: Vendedor
    synonyms: [vendedores, comercial, representante]
    expected_cardinality: 14
    physical:
      source: usr_int
      attribute: usr_int.nom_ape
      key: usr_int.usr_id
      relation: cmp_cab.usr_id = usr_int.usr_id
