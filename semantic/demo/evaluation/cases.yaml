# semantic/demo/evaluation/cases.yaml
# Banco de casos: pregunta -> interpretacion esperada.
# NO declara respuestas en cifras: eso depende de los datos.
# La interpretacion esperada depende solo de la capa semantica.
#
# Minimo del experimento: 60 casos.
# Composicion: 40% directas, 15% ambiguedad material, 15% continuaciones,
# 10% con premisa, 10% multiples objetivos, 10% fuera de alcance.
# CONGELAR antes de la primera corrida. No modificar segun resultados.

cases:
  - id: c001
    category: direct
    question: "¿Cuanto facturamos en julio?"
    expected:
      objectives:
        - objective: query_metric
          metric: net_revenue
          temporal: "julio"

  - id: c002
    category: direct
    question: "Compara la facturacion de julio contra junio"
    expected:
      objectives:
        - objective: compare
          metric: net_revenue
          temporal: ["julio", "junio"]

  - id: c003
    category: premise
    question: "¿Por que cayo la facturacion en julio?"
    expected:
      objectives:
        - objective: explain_variance
          metric: net_revenue
          temporal: ["julio", "junio"]
          premises: ["existe una caida entre ambos periodos"]

  - id: c004
    category: material_ambiguity
    question: "Mostrame los mejores clientes de este trimestre"
    expected:
      ambiguity: criterio de "mejores"
      options: [net_revenue, units_sold, operations]
      plan: not_proposed

  - id: c005
    category: direct
    question: "Ventas por region en el ano"
    expected:
      objectives:
        - objective: breakdown
          metric: net_revenue # acepcion por defecto de "ventas"
          dimension: region
          temporal: "el ano"

  - id: c006
    category: multiple_objectives
    question: "Compara julio contra junio y decime tambien el ranking anual de clientes"
    expected:
      objectives:
        - objective: compare
          metric: net_revenue
          temporal: ["julio", "junio"]
        - objective: rank
          metric: net_revenue
          dimension: customer
          temporal: "el ano"
          dependency: null # NO hereda "julio" del primero

  - id: c007
    category: continuation
    question: "Saca esos tres y compara de nuevo"
    previous_context: descomposicion por cliente con tres contribuyentes principales
    expected:
      continuity: continuation
      inherits: [metric, periods, dimension]
      filters: ["cliente distinto de los tres identificados"]

  - id: c008
    category: out_of_scope
    question: "¿Nos conviene abrir una sucursal en Cordoba?"
    expected:
      out_of_scope: requiere proyeccion y criterio de negocio
      offered_alternatives:
        [facturacion por region, evolucion mensual, ranking por region]

  - id: c009
    category: out_of_scope
    question: "¿Cual fue el margen por producto?"
    expected:
      # Bajo contexto restringido el concepto no esta en el catalogo entregado:
      # se informa como limitacion de alcance SIN nombrar el concepto.
      rejection: concept_not_available_in_context
      must_not_name: [margin, unit_cost]

  - id: c010
    category: direct
    question: "¿Cuantas operaciones hicimos la semana pasada?"
    expected:
      objectives:
        - objective: query_metric
          metric: operations
          temporal: "la semana pasada"

  # --- Faltan 50 casos. Se escriben ANTES de terminar el artefacto semantico,
  # --- recolectados de mas de una persona, y se congelan.
