# semantic/demo/connection.yaml
# Identidad de la conexion, calendario del negocio y umbrales.
# El artefacto es la fuente de verdad; la version se deriva del contenido.

id: demo
description: Distribuidora mayorista de demostracion. Esquema deliberadamente incomodo.
engine: postgresql

calendar:
  type: calendar # calendar | fiscal
  closing_month: 12
  week_start: monday

thresholds:
  # Relacion obligatoria: context_rows < preview_rows < materialization_rows
  context_rows: 20
  preview_rows: 100
  preview_columns: 20
  materialization_rows: 50000
  active_datasets_per_session: 5
  active_datasets_mb: 50
  decompose_variance_max_dimension_cardinality: 5000 # limite propio de decompose_variance, no global
  min_explanation_coverage: "0.70" # texto, no numero: evita perder precision via float
  closed_period_freshness_hours: 24
  open_period_freshness_minutes: 15
  query_time_limit_seconds: 30
  turn_budget_seconds: 90
  model_calls_budget: 5
  rows_examined_to_confirm: 1000000

sensitivity:
  # Conceptos sensibles y bajo que condicion. Alimenta a Contexto de acceso.
  - concept: unit_cost
    condition: role != admin
  - concept: margin
    condition: role != admin
