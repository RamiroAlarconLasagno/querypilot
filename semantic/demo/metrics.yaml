# semantic/demo/metrics.yaml
# Definicion de negocio y receta fisica JUNTAS, en el mismo bloque.
# Separarlas invitaria a que divergieran.

metrics:
  - id: net_revenue
    business_name: Facturacion
    definition: Ventas menos notas de credito, sin impuestos.
    synonyms: [ventas, ingresos, facturado, facturacion]
    default_sense_of: [ventas, ingresos]
    unit: ARS
    aggregations: [sum]
    combinable_dimensions: [customer, region, product, salesperson, category]
    min_granularity: day
    physical:
      source: cmp_cab
      measure: sum(cmp_det.imp_neto)
      relations:
        - from: cmp_cab
          to: cmp_det
          on: cmp_cab.nro_int = cmp_det.nro_int
      temporal_field: cmp_cab.f_emis
      exclusions:
        - cmp_cab.est_cod <> 9 # 9 = anulado

  - id: units_sold
    business_name: Unidades vendidas
    definition: Cantidad de unidades facturadas, neta de devoluciones.
    synonyms: [unidades, cantidad, volumen]
    unit: units
    aggregations: [sum]
    combinable_dimensions: [customer, region, product, salesperson, category]
    min_granularity: day
    physical:
      source: cmp_cab
      measure: sum(cmp_det.cant)
      relations:
        - from: cmp_cab
          to: cmp_det
          on: cmp_cab.nro_int = cmp_det.nro_int
      temporal_field: cmp_cab.f_emis
      exclusions:
        - cmp_cab.est_cod <> 9

  - id: operations
    business_name: Operaciones
    definition: Cantidad de comprobantes de venta emitidos.
    synonyms: [comprobantes, facturas, transacciones]
    unit: operations
    aggregations: [count]
    combinable_dimensions: [customer, region, salesperson]
    min_granularity: day
    physical:
      source: cmp_cab
      measure: distinct_count(cmp_cab.nro_int)
      temporal_field: cmp_cab.f_emis
      exclusions:
        - cmp_cab.est_cod <> 9

  - id: unit_cost
    business_name: Costo unitario
    definition: Costo de reposicion del articulo al momento de la venta.
    synonyms: [costo]
    unit: ARS
    aggregations: [average]
    combinable_dimensions: [product, category]
    min_granularity: day
    sensitive: true
    physical:
      source: cmp_det
      measure: average(cmp_det.cost_rep)
      temporal_field: cmp_cab.f_emis
